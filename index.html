<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="寶雅銷售分析">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>寶雅銷售分析</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f3;--surface:#fcfcfb;--surface2:#f0f0ed;--line:#e2e1dc;--line2:#cfcec8;
  --ink:#0b0b0b;--ink2:#52514e;--ink3:#7d7c77;
  --accent:#2a78d6;--accent-soft:#e3eefb;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;
  --up:#0f7b3f;--up-bg:#e3f4ea;--down:#c23a32;--down-bg:#fbe7e5;--warn:#a86b00;--warn-bg:#fbf0d9;
  --seq:42,120,214;
  --radius:10px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--surface2:#242422;--line:#2f2f2c;--line2:#3d3d39;
  --ink:#f0efec;--ink2:#c3c2b7;--ink3:#8f8e86;
  --accent:#3987e5;--accent-soft:#1d2b3d;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;
  --up:#4cc27d;--up-bg:#173225;--down:#ee7a72;--down-bg:#3a1d1b;--warn:#e0a83a;--warn-bg:#33270f;
  --seq:57,135,229;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
nav.side{width:200px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:15px;padding:4px 10px 2px}
.brand-sub{color:var(--ink3);font-size:12px;padding:0 10px 14px}
nav.side a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;margin-bottom:2px}
nav.side a:hover{background:var(--surface2)}
nav.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
nav.side .sep{height:1px;background:var(--line);margin:10px 6px}
.ico{width:18px;text-align:center;font-size:14px}
main{flex:1;min-width:0;padding:22px 26px 60px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--ink3);font-size:13px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>.card{flex:1;min-width:280px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .l{color:var(--ink3);font-size:12px}
.kpi .v{font-size:22px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink2)}
.chg{font-variant-numeric:tabular-nums;white-space:nowrap}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl label{font-size:12px;color:var(--ink3)}
select,input[type=text],input[type=number],input[type=search]{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;min-height:34px}
input[type=number]{width:110px}
select{max-width:240px}
.btn{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:34px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;min-height:28px;font-size:12.5px}
.btn.danger{color:var(--down)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:999px;padding:4px 11px;cursor:pointer;background:var(--surface);font-size:13px;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface2);font-weight:500;color:var(--ink2);cursor:pointer;user-select:none;z-index:1}
th.nosort{cursor:default}
th .ar{opacity:.5;font-size:10px;margin-left:3px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface2)}
td.wrap{white-space:normal;min-width:300px}
.nm{max-width:300px;overflow:hidden;text-overflow:ellipsis}
.code{color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0;border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);white-space:nowrap}
.tag.good{background:var(--up-bg);color:var(--up);border-color:transparent}
.tag.bad{background:var(--down-bg);color:var(--down);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 2px;color:var(--ink3);font-size:12.5px}
.muted{color:var(--ink3)}
.small{font-size:12px}
.empty{padding:30px;text-align:center;color:var(--ink3)}
.insights{margin:0;padding:0;list-style:none}
.insights li{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.insights li:last-child{border-bottom:0}
.insights .b{flex:none;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:100;display:none;max-width:320px}
#tip .t{font-weight:500;margin-bottom:3px}
.drop{border:2px dashed var(--line2);border-radius:var(--radius);padding:28px;text-align:center;background:var(--surface);cursor:pointer;transition:.15s}
.drop.hover{border-color:var(--accent);background:var(--accent-soft)}
.pending{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;background:var(--surface)}
.pending .hd{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px 20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:500}
.field .hint{font-size:12px;color:var(--ink3)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;max-width:980px;width:100%;padding:20px;border:1px solid var(--line)}
.modal .x{float:right}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px 16px;margin:10px 0 14px}
.info-grid div span{display:block;font-size:11.5px;color:var(--ink3)}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:10px;color:var(--ink2)}
.spin{width:28px;height:28px;border:3px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:300;display:none;max-width:90vw}
.bar-in{height:6px;border-radius:3px;background:var(--accent);opacity:.8}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mobile-nav{display:none}
@media (max-width:820px){
  body{padding-bottom:env(safe-area-inset-bottom)}
  .mobile-nav{padding-top:calc(8px + env(safe-area-inset-top));padding-left:calc(8px + env(safe-area-inset-left));padding-right:calc(8px + env(safe-area-inset-right))}
  main{padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}
  select,input[type=text],input[type=number],input[type=search],input[type=date]{font-size:16px}
  .btn{min-height:38px}
  .kpi .v{font-size:19px}
  h1{font-size:18px}
  th,td{padding:6px 7px;font-size:12.5px}
  .nm{max-width:170px;white-space:normal;line-height:1.35}
  td.wrap{min-width:200px}
  .app{flex-direction:column}
  nav.side{display:none}
  .mobile-nav{display:flex;overflow-x:auto;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);padding:8px;position:sticky;top:0;z-index:20}
  .mobile-nav a{flex:none;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:13px}
  .mobile-nav a.on{background:var(--accent-soft);color:var(--accent)}
  main{padding:14px 12px 60px}
}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><div id="loadmsg">載入資料中…</div></div>
<div class="app">
  <nav class="side" id="sidenav"></nav>
  <div class="mobile-nav" id="mobnav"></div>
  <main id="main"></main>
</div>
<div id="tip"></div>
<div id="toast"></div>
<script>
"use strict";
/* ================= 基本工具 ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('zh-TW');
const fmt=v=>v==null||v===''||!isFinite(v)?'–':NF.format(Math.round(v));
const fmt1=v=>v==null||!isFinite(v)?'–':(Math.round(v*10)/10).toLocaleString('zh-TW');
const money=v=>v==null||!isFinite(v)?'–':'$'+NF.format(Math.round(v));
function pctv(a,b){ if(b==null)return null; if(!b) return a>0?Infinity:(a<0?-Infinity:0); return (a-b)/Math.abs(b)*100;}
function chg(p,{plain}={}){ if(p==null||isNaN(p)) return '<span class="muted">–</span>';
  if(p===Infinity) return '<span class="chg up">▲ 新增</span>'; if(p===-Infinity) return '<span class="chg down">▼</span>';
  const c=p>0.05?'up':p<-0.05?'down':''; const a=p>0.05?'▲':p<-0.05?'▼':'＝';
  return `<span class="chg ${c}">${a} ${Math.abs(p)>=1000?'>999':fmt1(Math.abs(p))}%</span>`; }
const dchg=d=>{ if(d==null||!isFinite(d)) return '–'; const c=d>0?'up':d<0?'down':''; return `<span class="chg ${c}">${d>0?'+':''}${fmt(d)}</span>`;};
const dayN=(y,m,d)=>Math.round(Date.UTC(y,m-1,d)/864e5);
function ymdToDay(s){ s=String(s||'').replace(/\D/g,''); if(s.length<8) return null; return dayN(+s.slice(0,4),+s.slice(4,6),+s.slice(6,8)); }
function isoToDay(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return dayN(y,m,d);}
function dayToIso(n){ const d=new Date(n*864e5); return d.toISOString().slice(0,10);}
const md=n=>{const d=new Date(n*864e5);return (d.getUTCMonth()+1)+'/'+d.getUTCDate();};
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',ms);}
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= 壓縮/編碼 ================= */
function b64ToBytes(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function bytesToB64(u){let s='';const C=0x8000;for(let i=0;i<u.length;i+=C)s+=String.fromCharCode.apply(null,u.subarray(i,i+C));return btoa(s);}
async function gunzipText(bytes){const ds=new DecompressionStream('gzip');const st=new Blob([bytes]).stream().pipeThrough(ds);return await new Response(st).text();}
async function gzipText(text){const cs=new CompressionStream('gzip');const st=new Blob([text]).stream().pipeThrough(cs);return new Uint8Array(await new Response(st).arrayBuffer());}
function encCols(cols,rows){ // rows = array of arrays
  return cols.map((c,k)=>{const vals=rows.map(r=>r[k]);
    if(vals.every(v=>v==null||typeof v==='number')) return {t:'n',v:vals};
    const d=new Map(),idx=[];for(let v of vals){v=v==null?'':String(v);if(!d.has(v))d.set(v,d.size);idx.push(d.get(v));}
    return d.size<vals.length*0.6?{t:'d',d:[...d.keys()],i:idx}:{t:'s',v:vals.map(v=>v==null?'':String(v))};});
}
function decCols(g){ const cols=g.data.map(d=>d.t==='d'?d.i.map(i=>d.d[i]):d.v); const out=new Array(g.n);
  for(let i=0;i<g.n;i++){const o={};for(let k=0;k<g.cols.length;k++)o[g.cols[k]]=cols[k][i];out[i]=o;} return out;}

/* ================= 設定 ================= */
const DEF={storeName:'寶雅',year:new Date().getFullYear(),win:4,monthWin:3,growth:20,minAmt:100,abcA:70,abcB:90,
  lowCover:1,targetCover:3,overCover:12,liftTag:2,defaultLift:1.5,excludeStatus:'5',statusNames:'1=正常品,2=廠商缺貨,3=季節品,4=下架商品,5=試用品/試聞包,6=統倉採購商品,7=斷貨商品,8=問題商品,9=預計停售,0=停止銷售商品,A=管理統控商品',noOrder:'2,4,7,9,0',promoNoZero:true,excludeNeg:true,
  masterKeepAll:false,trashDays:3,pageSize:50,theme:'auto',stockSource:'master',insightBasis:'week',excludeDepts:'',cloud:false,updated:0};
let S={...DEF};
function applyTheme(){ const t=S.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):S.theme; document.documentElement.dataset.theme=t;}
const _memo={};function memoSet(k,fn){const v=String(S[k]||'');if(_memo[k]&&_memo[k][0]===v)return _memo[k][1];const r=fn(v);_memo[k]=[v,r];return r;}
const exclStatus=()=>memoSet('excludeStatus',v=>new Set(v.split(/[,，\s]+/).filter(Boolean)));
const exclDepts=()=>memoSet('excludeDepts',v=>new Set(v.split(/[,，\s]+/).filter(Boolean).map(s=>s.toUpperCase())));
function statusName(c){ if(c==null||c==='') return ''; const m={}; String(S.statusNames||'').split(/[,，\n]+/).forEach(p=>{const [k,v]=p.split(/[=:：]/);if(k&&v)m[k.trim().toUpperCase()]=v.trim();}); return c+' '+(m[String(c).toUpperCase()]||'');}
const noOrderSet=()=>memoSet('noOrder',v=>new Set(v.split(/[,，\s]+/).filter(Boolean).map(x=>x.toUpperCase())));

/* ================= 本機儲存 (IndexedDB) ================= */
const IDB={db:null,
  async open(){ if(this.db) return this.db; try{ this.db=await new Promise((res,rej)=>{const r=indexedDB.open('poya-sales-tool',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}); }catch(e){this.db=null;} return this.db;},
  async get(k){ try{const d=await this.open(); if(!d) return null; return await new Promise((res,rej)=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result??null);r.onerror=()=>rej(r.error);});}catch(e){return null;}},
  async set(k,v){ try{const d=await this.open(); if(!d) return false; await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);}); return true;}catch(e){return false;}},
  async del(k){ try{const d=await this.open(); if(!d) return; await new Promise((res)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res;});}catch(e){}}
};

/* ================= 雲端同步 (artifact db) ================= */
const CLOUD={db:null,uid:null,ok:false,msg:'資料存在這台電腦的瀏覽器',busy:false};
async function cloudInit(){
  try{ if(!window.claude||!window.claude.use){CLOUD.msg='此檢視不支援雲端';return;}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){CLOUD.msg='未登入或此檢視不支援雲端，只存在本機瀏覽器';renderStatus();return;}
    const id=await user.id(); if(!id){CLOUD.msg='無法取得使用者身分，只存在本機瀏覽器';renderStatus();return;}
    CLOUD.db=db;CLOUD.uid=id;CLOUD.ok=true;CLOUD.msg='雲端已連線';
    await cloudPull();
  }catch(e){CLOUD.msg='雲端連線失敗：'+(e&&e.message||e);}
  renderStatus();
}
const cref=k=>CLOUD.db.collection('data/users/'+CLOUD.uid).doc(k);
async function cget(k){ const s=await cref(k).get(); return s&&s.exists?s.data():null;}
async function cset(k,v){ try{ await cref(k).set(v);}catch(e){ if(e&&e.code==='unavailable'){await sleep(400+Math.random()*600);await cref(k).set(v);} else throw e;} }
const CHUNK=180000;
async function cloudPushDataset(id,payload){
  const n=Math.ceil(payload.length/CHUNK);
  for(let i=0;i<n;i++) await cset('c_'+id+'_'+i,{s:payload.slice(i*CHUNK,(i+1)*CHUNK)});
  return n;
}
async function cloudPushIndex(){
  if(!CLOUD.ok||!S.cloud) return;
  const idx={list:LOCAL.list.map(m=>({...m})),trash:LOCAL.trash||[],purgedBase:LOCAL.purgedBase||[],hiddenBase:LOCAL.hiddenBase,deleted:LOCAL.deleted.slice(-300),settings:S,updated:LOCAL.updated||Date.now()};
  await cset('index',idx);
}
async function cloudSyncAll(){
  if(!CLOUD.ok||!S.cloud||CLOUD.busy) return; CLOUD.busy=true; CLOUD.msg='同步中…'; renderStatus();
  try{
    for(const m of LOCAL.list){ if(m.chunks) continue; const rec=await IDB.get('ds_'+m.id); if(!rec) continue; m.chunks=await cloudPushDataset(m.id,rec.payload); await IDB.set('index',LOCAL); }
    await cloudPushIndex(); CLOUD.msg='雲端已同步 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ CLOUD.msg='雲端同步失敗（'+(e&&e.code||e&&e.message||e)+'），資料仍保存在本機'; }
  CLOUD.busy=false; renderStatus();
}
async function cloudPull(){
  if(!CLOUD.ok||!S.cloud) return;
  try{
    const idx=await cget('index'); let changed=false;
    if(idx){
      if(idx.settings&&(idx.settings.updated||0)>(S.updated||0)){S={...DEF,...idx.settings};applyTheme();await IDB.set('settings',S);changed=true;}
      const del=new Set([...(LOCAL.deleted||[]),...(idx.deleted||[])]); LOCAL.deleted=[...del];
      if((idx.updated||0)>(LOCAL.updated||0)){
        if(JSON.stringify(idx.hiddenBase||[])!==JSON.stringify(LOCAL.hiddenBase||[])){ LOCAL.hiddenBase=idx.hiddenBase||[]; changed=true; }
        const ct=idx.trash||[]; const ids=new Set(ct.map(t=>t.id));
        for(const t of ct) if(!t.base) LOCAL.list=LOCAL.list.filter(m=>m.id!==t.id);
        LOCAL.trash=[...ct,...(LOCAL.trash||[]).filter(t=>!ids.has(t.id)&&!t.base)]; LOCAL.purgedBase=idx.purgedBase||LOCAL.purgedBase||[]; changed=true;
      }
      const have=new Set([...LOCAL.list.map(m=>m.id),...(LOCAL.trash||[]).map(t=>t.id)]);
      for(const m of (idx.list||[])){
        if(have.has(m.id)||del.has(m.id)||!m.chunks) continue;
        CLOUD.msg='從雲端下載 '+(m.label||m.kind)+'…'; renderStatus();
        let s=''; for(let i=0;i<m.chunks;i++){const c=await cget('c_'+m.id+'_'+i); if(!c){s=null;break;} s+=c.s;}
        if(s==null) continue;
        await IDB.set('ds_'+m.id,{payload:s}); LOCAL.list.push(m); changed=true;
      }
      LOCAL.list=LOCAL.list.filter(m=>!del.has(m.id));
      await IDB.set('index',LOCAL);
    }
    if(changed){ await rebuildFromLocal(); route(); }
    await cloudSyncAll();
  }catch(e){ CLOUD.msg='雲端讀取失敗，使用本機資料'; renderStatus(); }
}

async function loadBase(){

  D.base={sales:[],promos:[],cats:[],items:{cols:[],n:0,data:[]},master:{cols:[],n:0,data:[],file:'',total:0,base:true}};

async function rebuildFromLocal(){
  INFO_CACHE.clear();
  const B=D.base, hidden=new Set(LOCAL.hiddenBase||[]);
  // 分類
  let catRows=B.cats; let masterRows=null, masterMeta={file:B.master.file,base:true,total:B.master.total};
  const userDs=[];
  for(const m of LOCAL.list){ const rec=await IDB.get('ds_'+m.id); if(!rec) continue; try{ const g=JSON.parse(await gunzipText(b64ToBytes(rec.payload))); userDs.push({m,g}); }catch(e){console.warn('bad ds',m,e);} }
  const lastOf=k=>userDs.filter(x=>x.m.kind===k).sort((a,b)=>(a.m.added||0)-(b.m.added||0)).pop();
  const uc=lastOf('cats'); if(uc) catRows=uc.g.rows;
  setCats(catRows);
  const um=lastOf('master');
  if(um){ masterRows=decCols(um.g); masterMeta={file:um.m.file,base:false,total:um.m.total,rows:um.g.n,added:um.m.added,id:um.m.id}; }
  else masterRows=decCols(B.master);
  D.master=masterFromRows(masterRows); D.masterMeta=masterMeta;
  // 補充品項 (來自銷售/手稿檔)
  D.extra.clear(); for(const r of decCols(B.items)) D.extra.set(r['店內碼'],{gtin:r['國碼'],name:r['品名'],dept:r['部門'],sub:r['小分類'],ven:r['廠編']});
  for(const x of userDs) if(x.g.items) for(const r of decCols(x.g.items)) if(!D.master.has(r['店內碼'])) D.extra.set(r['店內碼'],{gtin:r['國碼'],name:r['品名'],dept:r['部門'],sub:r['小分類'],ven:r['廠編']});
  // 銷售
  const sales=[];
  for(const g of B.sales){ if(hidden.has(g.id)) continue; sales.push({id:g.id,type:g.type,label:g.label,start:isoToDay(g.start),end:isoToDay(g.end),file:g.file,base:true,map:salesFromRows(decCols(g))}); }
  for(const x of userDs.filter(x=>x.m.kind==='sales')){ const m=x.m; sales.push({id:m.id,type:m.type,label:m.label,start:isoToDay(m.start),end:isoToDay(m.end),file:m.file,base:false,map:salesFromRows(decCols(x.g))}); }
  // 同類型同標籤：上傳檔覆蓋內建檔
  const seen=new Map(); for(const s of sales){ const k=s.type+'|'+s.label; const o=seen.get(k); if(!o||(o.base&&!s.base)) seen.set(k,s);}
  D.sales=[...seen.values()].sort((a,b)=>a.start-b.start);
  for(const s of D.sales){ let a=0,q=0,n=0; for(const r of s.map.values()){a+=r.a;q+=r.q;if(r.q>0)n++;} s.totA=a;s.totQ=q;s.sku=n; }
  // 手稿
  const promos=[];
  for(const g of B.promos){ if(hidden.has(g.id)) continue; promos.push({id:g.id,period:g.period,file:g.file,base:true,rows:promoFromRows(decCols(g))}); }
  for(const x of userDs.filter(x=>x.m.kind==='promo')) promos.push({id:x.m.id,period:x.m.period,file:x.m.file,base:false,rows:promoFromRows(decCols(x.g))});
  const pseen=new Map(); for(const p of promos){const o=pseen.get(p.period); if(!o||(o.base&&!p.base)) pseen.set(p.period,p);}
  D.promos=[...pseen.values()].sort((a,b)=>String(a.period).localeCompare(String(b.period)));
  for(const p of D.promos){ let s=Infinity,e=-Infinity; for(const r of p.rows){ if(r.s!=null&&r.s<s)s=r.s; if(r.e!=null&&r.e>e)e=r.e;} p.s=s;p.e=e; }
  D.promoIdx=new Map();
  for(const p of D.promos) for(const r of p.rows){ if(r.s==null||r.e==null) continue; let a=D.promoIdx.get(r.code); if(!a)D.promoIdx.set(r.code,a=[]); a.push({s:r.s,e:r.e,period:p.period,reason:r.reason,r}); }
  CALC.clear();
}

  const perW=basisMonth?4.345:1; const half=Math.floor(W.length/2), early=W.slice(0,half), late=W.slice(half);

  const dp=exclDepts();

  for(const code of codes){
    const i=info(code); if(dp.size&&dp.has(String(i.dept).toUpperCase())) continue;
    if(exclStatus().size&&exclStatus().has(i.status)) continue;
    const qs=W.map(w=>val(w,code,'q')), as=W.map(w=>val(w,code,'a'));
    const totQ=qs.reduce((a,b)=>a+b,0), totA=as.reduce((a,b)=>a+b,0);
    const avgW=W.length?totQ/W.length/perW:0;
    const eA=early.length?early.reduce((s,w)=>s+val(w,code,'a'),0)/early.length:0, lA=late.length?late.reduce((s,w)=>s+val(w,code,'a'),0)/late.length:0;
    const growth=early.length&&eA>0?(lA-eA)/eA*100:(lA>0&&early.length?Infinity:null);
    const stock=stockOf(code)||0, transit=i.transit||0; const cover=avgW>0?(stock+transit)/avgW:(stock>0?Infinity:null);
    items.push({code,i,name:i.name,sub:i.sub,subName:i.subName,dept:i.dept,qs,as,totQ,totA,avgW,eA,lA,growth,stock,transit,cover,upc:upc.get(code)||null});
  }
  // ABC
  const sold=items.filter(x=>x.totA>0).sort((a,b)=>b.totA-a.totA); const tot=sold.reduce((s,x)=>s+x.totA,0); let cum=0;
  for(const x of sold){ cum+=x.totA; const p=cum/tot*100; x.abc=p-x.totA/tot*100<S.abcA?'A':p-x.totA/tot*100<S.abcB?'B':'C'; }

/* ---------- 檔期分析 ---------- */
function reasonLift(p){ const key='rl|'+p.period; if(CALC.has(key)) return CALC.get(key); const m=new Map();
  for(const r of p.rows){ const lf=promoLift(r.code); if(!lf||lf.avgIn==null||lf.avgOut==null) continue; const o=m.get(r.reason)||{i:0,o:0,n:0}; o.i+=lf.avgIn;o.o+=lf.avgOut;o.n++; m.set(r.reason,o);}
  const res=new Map(); for(const [k,o] of m) res.set(k,o.o>0?o.i/o.o:null); CALC.set(key,res); return res;}
function promoDemand(code,p,r){
  r=r||p.rows.find(x=>x.code===code); if(!r) return null; const ws=weeks(); if(!ws.length) return null;
  const recent=ws.slice(-Math.max(1,S.win)); let base=0,n=0; for(const w of recent){ if(inPromo(code,w.start,w.end)) continue; base+=val(w,code,'q'); n++; }
  if(!n){ for(const w of recent){base+=val(w,code,'q');n++;} } const avg=n?base/n:0;
  const lf=promoLift(code); const rl=reasonLift(p).get(r.reason);
  let factor=lf&&lf.lift&&isFinite(lf.lift)?Math.min(5,Math.max(1,lf.lift)):(rl&&isFinite(rl)?Math.min(5,Math.max(1,rl)):+S.defaultLift);
  const wks=Math.max(1,((r.e??p.e)-(r.s??p.s)+1)/7); const ld=latestSalesDay(); const remainDays=Math.max(0,(r.e??p.e)-Math.max(ld,(r.s??p.s)-1)); const remainW=Math.min(wks,remainDays/7);
  const demand=avg*remainW*factor; const stock=stockOf(code)??r.stk??0; const tr=info(code).transit||0;
  const no=noOrderSet().has(String(info(code).status).toUpperCase());
  return {avg,factor,weeks:remainW,demand,stock,transit:tr,suggest:no?0:Math.max(0,Math.ceil(demand-stock-tr)),noOrder:no};
}

async function migrateTrash(){ // older versions kept deleted built-ins in hiddenBase without a date

async function handleFiles(files){

   ['資料','promoNoZero','手稿移除特價=0 的列','bool','滿額/回饋金/贈品類活動沒有特價，預設不列入檔期分析'],
   ['建議門檻','growth','成長／衰退門檻 (%)','number','後半段 vs 前半段變化超過此比例即標記'],
   ['建議門檻','minAmt','最低銷售額（避免小額雜訊）','number','成長、衰退判斷需達此銷售額'],
   ['建議門檻','abcA','ABC：A 類累計占比 (%)','number',''],
   ['建議門檻','abcB','ABC：B 類累計占比 (%)','number',''],
   ['建議門檻','lowCover','缺貨風險：可售週數低於','number','(庫存+在途) ÷ 週均銷量'],
   ['建議門檻','targetCover','建議訂量：目標可售週數','number','補到可賣 N 週'],
   ['建議門檻','overCover','庫存過高：可售週數高於','number',''],
   ['建議門檻','liftTag','促銷依賴：檔期倍數達','number','檔期週均 ÷ 非檔期週均'],
   ['建議門檻','defaultLift','檔期備貨：預設促銷倍數','number','商品與特賣原因都沒有歷史時使用'],
   ['資料','trashDays','回收桶保留天數','number','刪除的資料先放回收桶，超過此天數自動永久刪除（0＝立即永久刪除）']];
  const groups=[...new Set(F.map(f=>f[0]))];
  el.innerHTML=`<h1>設定</h1><div class="sub">修改後自動儲存，並套用到所有分析頁。</div>`+groups.map(g=>`<div class="card"><h2>${g}</h2><div class="grid2">${F.filter(f=>f[0]===g).map(([_,k,l,t,h,o])=>`<div class="field"><label for="cf-${k}">${l}</label>${
      t==='select'?`<select id="cf-${k}" data-k="${k}">${Object.entries(o).map(([v,n])=>`<option value="${v}" ${String(S[k])===v?'selected':''}>${n}</option>`).join('')}</select>`:
      t==='bool'?`<label style="font-weight:400"><input type="checkbox" id="cf-${k}" data-k="${k}" ${S[k]?'checked':''}> 啟用</label>`:
      `<input type="${t}" id="cf-${k}" data-k="${k}" value="${esc(S[k])}" step="any">`}${h?`<span class="hint">${h}</span>`:''}</div>`).join('')}</div></div>`).join('')+
  `<div class="card"><button class="btn danger" id="cf-reset">恢復預設值</button> <span class="small muted" id="cf-msg"></span></div>`;
  let t; const save=async(k)=>{ S.updated=Date.now(); await IDB.set('settings',S); if(k==='promoNoZero'){ await rebuildFromLocal(); } CALC.clear(); INFO_CACHE.clear(); applyTheme(); renderNav(); $('#cf-msg').textContent='已儲存'; clearTimeout(t); t=setTimeout(()=>{cloudPushIndex().catch(()=>{});},1500); };
  $$('[data-k]',el).forEach(inp=>inp.onchange=()=>{ const k=inp.dataset.k, f=F.find(x=>x[1]===k);
    S[k]=f[3]==='bool'?inp.checked:f[3]==='number'?(inp.value===''?DEF[k]:+inp.value):inp.value; save(k); });
  $('#cf-reset').onclick=async()=>{ if(!await confirmBox('將所有設定恢復預設值？','恢復')) return; S={...DEF}; await save(); route(); };
};

/* ================= 啟動 ================= */
(async function boot(){
  try{
    const s=await IDB.get('settings'); if(s) S={...DEF,...s}; if(!S.statusNames) S.statusNames=DEF.statusNames; if(S.storeName==='寶雅板橋北門店') S.storeName=DEF.storeName; applyTheme();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(S.theme==='auto'){applyTheme();route();} });
    $('#loadmsg').textContent='解壓縮內建資料…'; await loadBase();
    const idx=await IDB.get('index'); if(idx) LOCAL={list:[],hiddenBase:[],deleted:[],trash:[],...idx};
    await migrateTrash(); await purgeTrash(false);
    $('#loadmsg').textContent='整理資料…'; await rebuildFromLocal();
  }catch(e){ console.error(e); $('#loadmsg').textContent='載入失敗：'+e.message; return; }
  $('#loading').style.display='none'; route();
  renderStatus();
  try{ if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js'); }catch(e){}
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  setInterval(async()=>{ if(await purgeTrash(true)) route(); },36e5);
})();
</script>
</body>
